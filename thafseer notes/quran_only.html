<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المصحف الشريف | الآيات القرآنية فقط (من سورة النجم إلى سورة الإنسان)</title>
  <meta name="description" content="النص القرآني الكامل بالرسم العثماني الشريف بدون أي ترجمة أو شرح (من سورة النجم 53 إلى سورة الإنسان 76 - 24 سورة) في صفحة واحدة متصلة.">

  <!-- Google Fonts: Arabic Calligraphy (Amiri, Scheherazade New), UI (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #05140e;
      --bg-card: #0a1f16;
      --bg-card-elevated: #102d20;
      --accent-gold: #f3c258;
      --accent-gold-dark: #c69527;
      --accent-gold-light: rgba(243, 194, 88, 0.15);
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(243, 194, 88, 0.25);
      --quran-color: #38e1a6;
      --font-arabic: 'Amiri', 'Scheherazade New', serif;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
      --quran-font-size: 2.25rem;
      --line-height: 2.7;
    }

    [data-theme="sepia"] {
      --bg-main: #fbf7ee;
      --bg-card: #ffffff;
      --bg-card-elevated: #f0e6d2;
      --accent-gold: #8c5e06;
      --accent-gold-dark: #6e4803;
      --accent-gold-light: rgba(140, 94, 6, 0.12);
      --accent-emerald: #0b6946;
      --text-main: #241c13;
      --text-muted: #6e6150;
      --border-color: #dfd3be;
      --quran-color: #0b6140;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-elevated: #f1f5f9;
      --accent-gold: #0d5f43;
      --accent-gold-dark: #083c2a;
      --accent-gold-light: rgba(13, 95, 67, 0.1);
      --accent-emerald: #059669;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --quran-color: #046c4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* Top Navigation Header */
    .top-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 30;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .back-btn {
      background: var(--accent-gold-light);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 0.35rem 0.85rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }
    .back-btn:hover {
      background: var(--accent-gold);
      color: #05140e;
    }

    .app-title {
      font-family: var(--font-arabic);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
    }

    /* Navigation Links Between Pages */
    .page-switch-tabs {
      display: inline-flex;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
    }
    .page-switch-tab {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      transition: all 0.15s ease;
      font-family: var(--font-arabic);
    }
    .page-switch-tab:hover {
      color: var(--text-main);
    }
    .page-switch-tab.active {
      background: var(--accent-gold);
      color: #05140e;
      font-weight: 700;
    }

    /* Controls Bar */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-card-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      user-select: none;
      font-family: var(--font-ui);
    }
    .btn:hover {
      background: var(--accent-gold-light);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
    .btn.active {
      background: var(--accent-gold);
      color: #05140e;
      border-color: var(--accent-gold);
      font-weight: 700;
    }
    .btn-icon {
      padding: 0.35rem 0.55rem;
      font-size: 0.95rem;
    }

    /* Search input */
    .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      width: 175px;
      direction: rtl;
      font-family: var(--font-arabic);
      transition: width 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-gold);
      width: 230px;
      box-shadow: 0 0 0 2px var(--accent-gold-light);
    }

    /* Scope Selector */
    .scope-selector {
      display: inline-flex;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .scope-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-ui);
    }
    .scope-btn:hover {
      color: var(--text-main);
    }
    .scope-btn.active {
      background: var(--accent-gold);
      color: #05140e;
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    /* Main Container */
    .layout-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      overflow: hidden;
      position: relative;
    }

    /* Surahs Sidebar */
    .surahs-aside {
      width: 310px;
      background: var(--bg-card);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease, width 0.25s ease;
      z-index: 20;
    }
    .surahs-aside.collapsed {
      transform: translateX(100%);
      width: 0;
      overflow: hidden;
      border-left: none;
    }

    .sidebar-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card-elevated);
    }
    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-arabic);
    }

    .surahs-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding: 0.5rem 0.4rem;
    }

    .surah-card-item {
      padding: 0.8rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 0.45rem;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      transition: all 0.15s ease;
      position: relative;
    }
    .surah-card-item:hover {
      background: var(--bg-card-elevated);
      border-color: rgba(243, 194, 88, 0.3);
    }
    .surah-card-item.active {
      background: var(--accent-gold-light);
      border-color: var(--accent-gold);
    }

    .surah-meta-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    .surah-num-pill {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.08);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      color: var(--accent-gold);
      font-weight: 600;
      direction: ltr;
    }
    .surah-ayahs-pill {
      font-size: 0.72rem;
      color: var(--text-muted);
      direction: rtl;
    }

    .surah-ar-title {
      font-family: var(--font-arabic);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }
    .surah-card-item.active .surah-ar-title {
      color: var(--accent-gold);
    }

    /* Content Viewport */
    .content-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 1.8rem 2.4rem 4rem;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-main);
    }

    /* Mushaf Reading Sheet */
    .mushaf-sheet {
      width: 100%;
      max-width: 920px;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: 14px;
      padding: 2.8rem 3.4rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    /* Ornate Surah Frame / Header */
    .surah-mushaf-frame {
      border: 2px solid var(--accent-gold);
      background: var(--bg-card-elevated);
      border-radius: 12px;
      padding: 1.2rem 1.6rem;
      margin-bottom: 2.5rem;
      text-align: center;
      position: relative;
      box-shadow: inset 0 0 16px rgba(0,0,0,0.25);
    }
    .surah-mushaf-frame::before {
      content: "۞";
      position: absolute;
      top: -14px;
      right: 20px;
      background: var(--bg-card);
      color: var(--accent-gold);
      padding: 0 0.5rem;
      font-size: 1.2rem;
    }
    .surah-mushaf-frame::after {
      content: "۞";
      position: absolute;
      bottom: -14px;
      left: 20px;
      background: var(--bg-card);
      color: var(--accent-gold);
      padding: 0 0.5rem;
      font-size: 1.2rem;
    }

    .surah-frame-title {
      font-family: var(--font-arabic);
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .surah-frame-meta {
      font-family: var(--font-arabic);
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
    }

    /* Continuous Quran Flow */
    .quran-flow-container {
      font-family: var(--font-arabic);
      font-size: var(--quran-font-size);
      line-height: var(--line-height);
      color: var(--quran-color);
      text-align: justify;
      text-justify: inter-word;
      word-spacing: 0.12em;
    }

    .ayah-word-span {
      display: inline;
    }

    /* Classical Ayah End Symbol ۝ */
    .ayah-marker-circ {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
      font-family: var(--font-arabic);
      font-size: calc(var(--quran-font-size) * 0.6);
      width: calc(var(--quran-font-size) * 0.95);
      height: calc(var(--quran-font-size) * 0.95);
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      margin: 0 0.45rem;
      font-weight: 700;
      line-height: 1;
      vertical-align: middle;
      background: rgba(243, 194, 88, 0.08);
      user-select: none;
    }
    .ayah-marker-circ:hover {
      background: var(--accent-gold);
      color: #05140e;
      cursor: pointer;
    }

    /* Sticky Quick Jump Bar in All Quran View */
    .surah-jump-bar {
      position: sticky;
      top: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.55rem 0.9rem;
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      z-index: 10;
      margin: -2.8rem -3.4rem 2.2rem;
      border-radius: 12px 12px 0 0;
    }
    .jump-pill {
      background: var(--bg-card-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      font-family: var(--font-arabic);
      transition: all 0.15s;
    }
    .jump-pill:hover, .jump-pill.active {
      background: var(--accent-gold);
      color: #05140e;
      font-weight: 700;
    }

    /* Search Highlighting */
    mark.search-highlight {
      background: #eab308;
      color: #000;
      padding: 0.1rem 0.25rem;
      border-radius: 3px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-gold);
      color: #05140e;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 99;
      pointer-events: none;
      opacity: 0;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .surahs-aside {
        position: absolute;
        top: 0;
        bottom: 0;
        right: 0;
        box-shadow: -4px 0 20px rgba(0,0,0,0.5);
      }
      .content-viewport {
        padding: 1rem 0.8rem 3rem;
      }
      .mushaf-sheet {
        padding: 1.6rem 1.4rem;
      }
      .surah-jump-bar {
        margin: -1.6rem -1.4rem 1.5rem;
      }
      .app-title {
        font-size: 1.2rem;
      }
      .surah-frame-title {
        font-size: 2rem;
      }
    }

    @media print {
      body {
        height: auto;
        overflow: visible;
        background: #fff !important;
        color: #000 !important;
      }
      .top-header, .surahs-aside, .surah-jump-bar, .header-actions {
        display: none !important;
      }
      .layout-container {
        height: auto;
      }
      .content-viewport {
        padding: 0;
      }
      .mushaf-sheet {
        box-shadow: none;
        border: none;
        padding: 0;
        max-width: 100%;
      }
    }
  </style>
</head>

  <!-- Load Data -->
  <script src="thafseer_data.js"></script>

  <script>
    // State management
    const SURAHS = window.TAFSEER_DATA;

    let currentSurahIndex = 0; // index in SURAHS array
    let currentScope = "surah"; // "surah" | "all_quran"
    let currentQuranFontSize = 2.25;
    let themeIndex = 0;
    const themes = ["dark", "sepia", "light"];

    // DOM Elements
    const surahsSidebar = document.getElementById("surahsSidebar");
    const surahsList = document.getElementById("surahsList");
    const readingContainer = document.getElementById("readingContainer");
    const contentViewport = document.getElementById("contentViewport");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");

    // Arabic numeral converter
    function toArabicNumeral(n) {
      return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    // Initialize
    function init() {
      renderSurahsSidebar();
      handleUrlHash();
      renderContent();
    }

    // Hash Routing
    function handleUrlHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;

      if (hash === "all") {
        currentScope = "all_quran";
      } else if (hash.startsWith("surah=")) {
        const sNum = parseInt(hash.split("=")[1]);
        const sIdx = SURAHS.findIndex(s => s.surahNumber === sNum);
        if (sIdx !== -1) {
          currentSurahIndex = sIdx;
          currentScope = "surah";
        }
      }
      updateScopeButtons();
    }

    // Render Surahs Sidebar List (Pure Arabic)
    function renderSurahsSidebar() {
      surahsList.innerHTML = SURAHS.map((surah, idx) => {
        const isActive = idx === currentSurahIndex;
        const ayahCount = surah.ayahs.length;
        return `
          <li class="surah-card-item ${isActive ? 'active' : ''}" data-surah-idx="${idx}" onclick="selectSurah(${idx})">
            <div class="surah-meta-top">
              <span class="surah-num-pill">سورة ${toArabicNumeral(surah.surahNumber)}</span>
              <span class="surah-ayahs-pill">${toArabicNumeral(ayahCount)} آية</span>
            </div>
            <div class="surah-ar-title">${surah.surahNameArabic}</div>
          </li>
        `;
      }).join("");
    }

    function selectSurah(idx) {
      currentSurahIndex = idx;
      updateSidebarActive();

      if (currentScope === "all_quran") {
        const headingEl = document.getElementById(`surah-heading-${SURAHS[idx].surahNumber}`);
        if (headingEl) {
          headingEl.scrollIntoView({ behavior: 'smooth' });
        }
      } else {
        renderContent();
        contentViewport.scrollTop = 0;
      }

      // Auto close sidebar on mobile
      if (window.innerWidth <= 900) {
        surahsSidebar.classList.add("collapsed");
      }
    }

    function updateSidebarActive() {
      document.querySelectorAll(".surah-card-item").forEach(el => {
        const idx = parseInt(el.getAttribute("data-surah-idx"));
        if (idx === currentSurahIndex) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });
    }

    function updateScopeButtons() {
      document.getElementById("scopeSurahBtn").classList.toggle("active", currentScope === "surah");
      document.getElementById("scopeAllQuranBtn").classList.toggle("active", currentScope === "all_quran");
    }

    // Helper: Toast
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    // Helper: Escape Regex
    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    // Helper: Highlight text
    function highlightSearch(text, query) {
      if (!text) return '';
      if (!query || !query.trim()) return text;
      const cleanQ = query.trim();
      const re = new RegExp(`(${escapeRegExp(cleanQ)})`, 'gi');
      return text.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    // Copy single ayah
    window.copyAyah = function(sName, aNum, text) {
      navigator.clipboard.writeText(`﴿ ${text} ﴾ [${sName}: ${toArabicNumeral(aNum)}]`).then(() => {
        showToast(`تم نسخ الآية [${toArabicNumeral(aNum)}] بنجاح`);
      });
    };

    // Render continuous flowing Quran text for a surah
    function renderSurahFlowHtml(surah, query) {
      let flowHtml = '';
      surah.ayahs.forEach(a => {
        const qText = highlightSearch(a.quranText.trim(), query);
        const aNumAr = toArabicNumeral(a.ayahNumber);
        const cleanRawText = a.quranText.trim().replace(/'/g, "\\'");

        flowHtml += `
          <span class="ayah-word-span">${qText}</span>
          <span class="ayah-marker-circ" title="آية ${aNumAr} (اضغط للنسخ)" onclick="copyAyah('${surah.surahNameArabic}', ${a.ayahNumber}, '${cleanRawText}')">${aNumAr}</span>
        `;
      });
      return flowHtml;
    }

    // Master Content Renderer
    function renderContent(query = "") {
      if (currentScope === "surah") {
        renderSurahView(currentSurahIndex, query);
      } else {
        renderAllQuranView(query);
      }
    }

    // 1. Render Single Surah
    function renderSurahView(surahIdx, query) {
      const surah = SURAHS[surahIdx];
      const sNumAr = toArabicNumeral(surah.surahNumber);
      const ayahsCountAr = toArabicNumeral(surah.ayahs.length);

      let html = `
        <div class="surah-mushaf-frame">
          <h2 class="surah-frame-title">${surah.surahNameArabic}</h2>
          <div class="surah-frame-meta">سورة رقم (${sNumAr}) • آياتها (${ayahsCountAr})</div>
        </div>

        <div class="quran-flow-container">
          ${renderSurahFlowHtml(surah, query)}
        </div>
      `;

      readingContainer.innerHTML = html;
      window.location.hash = `#surah=${surah.surahNumber}`;
    }

    // 2. Render All 24 Surahs Continuously on One Page
    function renderAllQuranView(query) {
      let html = `
        <div class="surah-jump-bar">
          <span style="font-size:0.82rem; font-weight:700; color:var(--accent-gold); align-self:center; margin-left:0.5rem; white-space:nowrap;">انتقال سريع:</span>
          ${SURAHS.map((s, idx) => `
            <a href="#surah-heading-${s.surahNumber}" class="jump-pill" onclick="event.preventDefault(); document.getElementById('surah-heading-${s.surahNumber}').scrollIntoView({behavior:'smooth'});">${toArabicNumeral(s.surahNumber)}. ${s.surahNameArabic.replace('سُورَةُ ', '')}</a>
          `).join('')}
        </div>
      `;

      SURAHS.forEach((surah, idx) => {
        const sNumAr = toArabicNumeral(surah.surahNumber);
        const ayahsCountAr = toArabicNumeral(surah.ayahs.length);

        html += `
          <div id="surah-heading-${surah.surahNumber}" class="surah-mushaf-frame" style="margin-top: ${idx > 0 ? '5rem' : '1.5rem'};">
            <h2 class="surah-frame-title">${surah.surahNameArabic}</h2>
            <div class="surah-frame-meta">سورة رقم (${sNumAr}) • آياتها (${ayahsCountAr})</div>
          </div>

          <div class="quran-flow-container">
            ${renderSurahFlowHtml(surah, query)}
          </div>
        `;
      });

      readingContainer.innerHTML = html;
      window.location.hash = `#all`;
    }

    // Event Listeners: Scopes
    document.getElementById("scopeSurahBtn").addEventListener("click", () => {
      currentScope = "surah";
      updateScopeButtons();
      renderContent();
      contentViewport.scrollTop = 0;
    });

    document.getElementById("scopeAllQuranBtn").addEventListener("click", () => {
      currentScope = "all_quran";
      updateScopeButtons();
      renderContent();
      contentViewport.scrollTop = 0;
    });

    // Font resizing
    document.getElementById("btnFontInc").addEventListener("click", () => {
      if (currentQuranFontSize < 3.2) {
        currentQuranFontSize += 0.15;
        document.documentElement.style.setProperty('--quran-font-size', `${currentQuranFontSize}rem`);
      }
    });

    document.getElementById("btnFontDec").addEventListener("click", () => {
      if (currentQuranFontSize > 1.4) {
        currentQuranFontSize -= 0.15;
        document.documentElement.style.setProperty('--quran-font-size', `${currentQuranFontSize}rem`);
      }
    });

    // Theme toggling
    document.getElementById("btnThemeToggle").addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % themes.length;
      document.documentElement.setAttribute('data-theme', themes[themeIndex]);
    });

    // Sidebar toggles
    document.getElementById("btnToggleSurahs").addEventListener("click", () => {
      surahsSidebar.classList.toggle("collapsed");
    });
    document.getElementById("btnCloseSidebar").addEventListener("click", () => {
      surahsSidebar.classList.add("collapsed");
    });

    // Search input
    let searchTimer = null;
    searchInput.addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        renderContent(e.target.value);
      }, 300);
    });

    // Run
    init();
  </script>
</body>
</html>
