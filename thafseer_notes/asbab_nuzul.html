<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أسباب النزول في تفسير الجلالين (نزلت / نزل / أنزل) مع الشرح والبيان بالمليبارية</title>
  <meta name="description" content="جميع أسباب النزول ومواضع (نزلت في / نزل لما / أنزل) الواردة في تفسير الجلالين من سورة النجم إلى سورة الإنسان مع الآيات والعبارات والشرح المفصل باللغة المليبارية.">

  <!-- Google Fonts: Arabic (Amiri, Scheherazade New), Malayalam (Noto Sans Malayalam), UI (Plus Jakarta Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans+Malayalam:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #06130d;
      --bg-card: #0c1e15;
      --bg-card-elevated: #122b1f;
      --accent-gold: #f3c258;
      --accent-gold-dark: #c69527;
      --accent-gold-light: rgba(243, 194, 88, 0.15);
      --accent-emerald: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: rgba(243, 194, 88, 0.22);
      --matn-color: #fbd36d;
      --matn-bg: rgba(243, 194, 88, 0.15);
      --quran-color: #34d399;
      --font-arabic: 'Amiri', 'Scheherazade New', serif;
      --font-ui: 'Plus Jakarta Sans', system-ui, sans-serif;
      --font-ml: 'Noto Sans Malayalam', sans-serif;
      --arabic-font-size: 1.6rem;
      --ml-font-size: 1.02rem;
      --line-height: 2.3;
    }

    [data-theme="sepia"] {
      --bg-main: #f8f4ec;
      --bg-card: #ffffff;
      --bg-card-elevated: #eee5d3;
      --accent-gold: #92640a;
      --accent-gold-dark: #6e4a05;
      --accent-gold-light: rgba(146, 100, 10, 0.12);
      --accent-emerald: #0b6946;
      --text-main: #2b2319;
      --text-muted: #6e6252;
      --border-color: #dfd4bf;
      --matn-color: #8c2409;
      --matn-bg: rgba(140, 36, 9, 0.08);
      --quran-color: #0b6946;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --bg-card-elevated: #f1f5f9;
      --accent-gold: #0d5f43;
      --accent-gold-dark: #083c2a;
      --accent-gold-light: rgba(13, 95, 67, 0.1);
      --accent-emerald: #059669;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --matn-color: #0369a1;
      --matn-bg: rgba(3, 105, 161, 0.08);
      --quran-color: #047857;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background 0.2s, color 0.2s;
    }

    /* Top Navigation Header */
    .top-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.6rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      flex-shrink: 0;
      z-index: 30;
    }

    .header-main-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      width: 100%;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      min-width: 0;
    }

    .back-btn {
      background: var(--accent-gold-light);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
      font-family: var(--font-ml);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .back-btn:hover {
      background: var(--accent-gold);
      color: #06130d;
    }

    .app-title {
      font-family: var(--font-arabic);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-gold);
      letter-spacing: 0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: var(--font-arabic);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text-wrap {
      min-width: 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-shrink: 0;
    }

    .btn {
      background: var(--bg-card-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.32rem 0.65rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      transition: all 0.15s ease;
      user-select: none;
      font-family: var(--font-ui);
      text-decoration: none;
      line-height: 1.2;
    }
    .btn:hover {
      background: var(--accent-gold-light);
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
    .btn.active {
      background: var(--accent-gold);
      color: #06130d;
      border-color: var(--accent-gold);
      font-weight: 700;
    }
    .btn-icon {
      padding: 0.32rem 0.5rem;
      min-width: 32px;
      height: 32px;
      font-size: 0.88rem;
    }

    /* Sub-bar: scrollable tabs and full search input */
    .header-sub-bar {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      flex-wrap: wrap;
    }

    .header-nav-scroll-wrap {
      display: flex;
      align-items: center;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
      max-width: 100%;
    }
    .header-nav-scroll-wrap::-webkit-scrollbar {
      display: none;
    }

    /* Page switch tabs */
    .page-switch-tabs {
      display: inline-flex;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 3px;
      gap: 3px;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .page-switch-tab {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.22rem 0.65rem;
      border-radius: 999px;
      transition: all 0.15s ease;
      font-family: var(--font-arabic);
      white-space: nowrap;
    }
    .page-switch-tab:hover {
      color: var(--text-main);
    }
    .page-switch-tab.active {
      background: var(--accent-gold);
      color: #06130d;
      font-weight: 700;
    }

    .search-input-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .search-input {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      width: 100%;
      direction: rtl;
      font-family: var(--font-arabic);
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--accent-gold-light);
    }

    /* Main Container */
    .layout-container {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      width: 100%;
    }

    /* Content Viewport */
    .content-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.8rem 2.4rem 4rem;
      scroll-behavior: smooth;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--bg-main);
      width: 100%;
      box-sizing: border-box;
    }

    .asbab-sheet {
      width: 100%;
      max-width: 950px;
      box-sizing: border-box;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 2.5rem 3rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Hero Stats Banner */
    .hero-stats-banner {
      width: 100%;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(243, 194, 88, 0.12) 0%, rgba(16, 185, 129, 0.12) 100%);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.4rem 1.8rem;
      margin-bottom: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .stats-title {
      font-family: var(--font-arabic);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.25rem;
      line-height: 1.35;
    }
    .stats-desc {
      font-family: var(--font-ml);
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .stats-badge-pill {
      background: var(--accent-gold);
      color: #06130d;
      font-weight: 700;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-family: var(--font-arabic);
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    /* Surah Section Header */
    .surah-asbab-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.8rem;
      margin: 3rem 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: relative;
      flex-wrap: wrap;
    }
    .surah-asbab-title {
      font-family: var(--font-arabic);
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent-gold);
      line-height: 1.35;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .surah-asbab-count {
      font-family: var(--font-ml);
      font-size: 0.82rem;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    /* Asbab Card Item */
    .asbab-card {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.6rem 1.8rem;
      margin-bottom: 1.8rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      position: relative;
    }
    .asbab-card:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }

    .asbab-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px dashed var(--border-color);
    }

    .ayah-num-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-arabic);
      font-weight: 700;
      color: var(--accent-gold);
      font-size: 1.1rem;
    }

    .ayah-circ {
      background: var(--accent-gold);
      color: #06130d;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    /* Quran Verse Box */
    .asbab-quran-box {
      font-family: var(--font-arabic);
      font-size: 1.85rem;
      line-height: 2.3;
      color: var(--quran-color);
      font-weight: 700;
      text-align: justify;
      background: rgba(16, 185, 129, 0.06);
      border-radius: 8px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 1.2rem;
      border-right: 4px solid var(--accent-emerald);
    }

    /* Arabic Sharh Jalalayn Box */
    .asbab-arabic-box {
      font-family: var(--font-arabic);
      font-size: var(--arabic-font-size);
      line-height: var(--line-height);
      color: var(--text-main);
      text-align: justify;
      background: rgba(0, 0, 0, 0.22);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      border-right: 3px solid var(--accent-gold);
    }
    .box-label-ar {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.4rem;
      display: block;
    }

    /* Malayalam Sharh Explanation Box */
    .asbab-ml-box {
      direction: ltr;
      text-align: left;
      font-family: var(--font-ml);
      font-size: var(--ml-font-size);
      line-height: 1.95;
      color: #cbd5e1;
      background: rgba(56, 189, 248, 0.05);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      border-left: 3.5px solid #38bdf8;
    }
    .box-label-ml {
      font-size: 0.88rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    [data-theme="sepia"] .asbab-ml-box {
      background: rgba(2, 132, 199, 0.05);
      color: #383025;
      border-left-color: #0284c7;
    }

    [data-theme="light"] .asbab-ml-box {
      background: #f8fafc;
      color: #334155;
      border-left-color: #0284c7;
    }

    /* Matn highlight */
    .matn-phrase {
      color: var(--matn-color);
      font-weight: 700;
      background: var(--matn-bg);
      padding: 0.05rem 0.25rem;
      border-radius: 4px;
    }

    /* Sticky Jump Bar */
    .surah-jump-bar {
      position: sticky;
      top: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 0.55rem 0.9rem;
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      z-index: 10;
      margin: -2.5rem -3rem 2rem;
      border-radius: 14px 14px 0 0;
    }
    .jump-pill {
      background: var(--bg-card-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: none;
      font-family: var(--font-arabic);
      transition: all 0.15s;
    }
    .jump-pill:hover {
      background: var(--accent-gold);
      color: #06130d;
      font-weight: 700;
    }

    /* Search Highlighting */
    mark.search-highlight {
      background: #eab308;
      color: #000;
      padding: 0.1rem 0.25rem;
      border-radius: 3px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--accent-gold);
      color: #06130d;
      padding: 0.6rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 99;
      pointer-events: none;
      opacity: 0;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .surah-jump-bar::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 900px) {
      .content-viewport {
        padding: 1rem 0.8rem 3rem;
      }
      .asbab-sheet {
        padding: 1.6rem 1.4rem;
      }
      .surah-jump-bar {
        margin: -1.6rem -1.4rem 1.5rem;
      }
      .app-title {
        font-size: 1.2rem;
      }
      .asbab-quran-box {
        font-size: 1.55rem;
      }
    }

    @media (max-width: 540px) {
      .top-header {
        padding: 0.45rem 0.65rem;
        gap: 0.4rem;
      }
      .header-main-bar {
        gap: 0.4rem;
      }
      .header-brand {
        gap: 0.4rem;
      }
      .back-btn {
        padding: 0.25rem 0.55rem;
        font-size: 0.72rem;
      }
      .app-title {
        font-size: 1.05rem;
      }
      .app-subtitle {
        display: none;
      }
      .btn {
        padding: 0.28rem 0.48rem;
        font-size: 0.75rem;
      }
      .btn-icon {
        min-width: 28px;
        height: 28px;
        padding: 0.2rem 0.35rem;
        font-size: 0.82rem;
      }
      .header-sub-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 0.35rem;
      }
      .header-nav-scroll-wrap {
        width: 100%;
      }
      .page-switch-tabs {
        width: 100%;
        display: flex;
        justify-content: space-between;
      }
      .page-switch-tab {
        font-size: 0.72rem;
        padding: 0.22rem 0.4rem;
        text-align: center;
        flex: 1;
      }
      .search-input-wrap {
        width: 100%;
        min-width: 100%;
      }
      .search-input {
        padding: 0.35rem 0.65rem;
        font-size: 0.8rem;
      }
      .content-viewport {
        padding: 0.5rem 0.4rem 3rem;
      }
      .asbab-sheet {
        padding: 0.9rem 0.75rem 2rem;
        border-radius: 10px;
      }
      .surah-jump-bar {
        margin: -0.9rem -0.75rem 1.2rem;
        padding: 0.45rem 0.55rem;
        gap: 0.35rem;
        border-radius: 10px 10px 0 0;
      }
      .jump-pill {
        padding: 0.2rem 0.55rem;
        font-size: 0.74rem;
      }
      .hero-stats-banner {
        padding: 0.85rem 0.85rem;
        margin-bottom: 1.2rem;
        border-radius: 9px;
        gap: 0.6rem;
      }
      .stats-title {
        font-size: 1.15rem;
        line-height: 1.35;
      }
      .stats-desc {
        font-size: 0.82rem;
        line-height: 1.6;
      }
      .stats-badge-pill {
        font-size: 0.76rem;
        padding: 0.32rem 0.7rem;
        width: 100%;
        justify-content: center;
      }
      .surah-asbab-header {
        margin: 1.8rem 0 1rem;
        flex-direction: column;
        align-items: flex-start;
        gap: 0.35rem;
      }
      .surah-asbab-title {
        font-size: 1.35rem;
      }
      .asbab-card {
        padding: 0.95rem 0.8rem;
        margin-bottom: 1.2rem;
        border-radius: 10px;
      }
      .ayah-num-badge {
        font-size: 0.92rem;
      }
      .ayah-circ {
        width: 26px;
        height: 26px;
        font-size: 0.8rem;
      }
      .asbab-quran-box {
        font-size: 1.35rem;
        line-height: 2.1;
        padding: 0.65rem 0.8rem;
        margin-bottom: 0.85rem;
        border-right-width: 3px;
      }
      .asbab-arabic-box {
        font-size: 1.15rem;
        line-height: 1.95;
        padding: 0.75rem 0.8rem;
        margin-bottom: 0.85rem;
        border-right-width: 3px;
      }
      .box-label-ar {
        font-size: 0.76rem;
      }
      .asbab-ml-box {
        font-size: 0.92rem;
        line-height: 1.75;
        padding: 0.75rem 0.8rem;
        border-left-width: 3px;
      }
      .box-label-ml {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="top-header">
    <!-- Top Row: Brand + Action Buttons -->
    <div class="header-main-bar">
      <div class="header-brand">
        <a href="../index.html" class="back-btn" title="الرجوع إلى الفهرس العام / Home">
          ← പ്രധാന പേജ്
        </a>
        <div class="brand-text-wrap">
          <h1 class="app-title">أسباب النزول في تفسير الجلالين</h1>
          <div class="app-subtitle">
            جميع مواضع (نزلت / نزل / أنزل) مع الشرح المفصل بالمليبارية
          </div>
        </div>
      </div>

      <!-- Header Actions & Controls -->
      <div class="header-actions">
        <!-- Font Resize -->
        <button id="btnFontDec" class="btn btn-icon" title="تصغير حجم الخط" aria-label="تصغير الخط">A-</button>
        <button id="btnFontInc" class="btn btn-icon" title="تكبير حجم الخط" aria-label="تكبير الخط">A+</button>

        <!-- Theme Switcher -->
        <button id="btnThemeToggle" class="btn btn-icon" title="تبديل المظهر (ليلي / ورقي / نهاري)" aria-label="تبديل المظهر">
          🎨
        </button>

        <!-- Download Text Button -->
        <a href="thafseer_text.txt" download class="btn" title="تحميل النص الكامل txt">
          💾 txt
        </a>
      </div>
    </div>

    <!-- Sub Row: Scrollable Navigation Tabs + Search Bar -->
    <div class="header-sub-bar">
      <div class="header-nav-scroll-wrap">
        <nav class="page-switch-tabs" aria-label="تنقل الصفحات">
          <a href="index.html" class="page-switch-tab" title="الآيات مع تفسير الجلالين">
            📖 التفسير
          </a>
          <a href="quran_only.html" class="page-switch-tab" title="المصحف الشريف - القرآن فقط">
            🕌 القرآن فقط
          </a>
          <a href="full_tafseer.html" class="page-switch-tab" title="تفسير الجلالين المتصل كاملاً">
            📜 تفسير مسترسل
          </a>
          <a href="asbab_nuzul.html" class="page-switch-tab active" title="أسباب النزول والشرح المليباري">
            ✨ أسباب النزول
          </a>
        </nav>
      </div>

      <div class="search-input-wrap">
        <input type="text" id="searchInput" class="search-input" placeholder="بحث في أسباب النزول (عثمان، حاطب، خولة...)" aria-label="بحث في أسباب النزول">
      </div>
    </div>
  </header>

  <!-- Layout Container -->
  <div class="layout-container">
    <main id="contentViewport" class="content-viewport">
      <div id="readingContainer" class="asbab-sheet">
        <!-- Content will be rendered dynamically -->
      </div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">تم النسخ بنجاح!</div>

  <!-- Load Data -->
  <script src="thafseer_data.js"></script>
  <script src="asbab_data.js"></script>

  <script>
    const SURAHS = window.TAFSEER_DATA;
    const ASBAB = window.ASBAB_DATA;

    let currentArabicFontSize = 1.6;
    let themeIndex = 0;
    const themes = ["dark", "sepia", "light"];

    const readingContainer = document.getElementById("readingContainer");
    const searchInput = document.getElementById("searchInput");
    const toast = document.getElementById("toast");

    function toArabicNumeral(n) {
      return String(n).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function highlightSearch(text, query) {
      if (!text) return '';
      if (!query || !query.trim()) return text;
      const cleanQ = query.trim();
      const re = new RegExp(`(${escapeRegExp(cleanQ)})`, 'gi');
      return text.replace(re, '<mark class="search-highlight">$1</mark>');
    }

    function formatMatnPhrases(text) {
      if (!text) return '';
      return text.replace(/«(.*?)»/g, '<span class="matn-phrase">«$1»</span>');
    }

    window.copyAsbabCard = function(sName, aNum, quran, arabic, ml) {
      const full = `
[سورة ${sName} - آية ${toArabicNumeral(aNum)}]
القرآن: ﴿ ${quran} ﴾
عبارة تفسير الجلالين: ${arabic}
മലയാള വിശദീകരണം: ${ml}
      `.trim();
      navigator.clipboard.writeText(full).then(() => {
        showToast(`تم نسخ سبب نزول الآية ${toArabicNumeral(aNum)}`);
      });
    };

    function renderAsbabPage(query = "") {
      const surahsWithAsbab = SURAHS.filter(s => ASBAB[s.surahNumber] && ASBAB[s.surahNumber].length > 0);
      const totalEvents = Object.values(ASBAB).reduce((acc, cur) => acc + cur.length, 0);

      let html = `
        <div class="surah-jump-bar">
          <span style="font-size:0.82rem; font-weight:700; color:var(--accent-gold); align-self:center; margin-left:0.5rem; white-space:nowrap;">انتقال للسورة:</span>
          ${surahsWithAsbab.map(s => `
            <a href="#asbab-surah-${s.surahNumber}" class="jump-pill" onclick="event.preventDefault(); document.getElementById('asbab-surah-${s.surahNumber}').scrollIntoView({behavior:'smooth'});">${toArabicNumeral(s.surahNumber)}. ${s.surahNameArabic.replace('سُورَةُ ', '')}</a>
          `).join('')}
        </div>

        <div class="hero-stats-banner">
          <div>
            <div class="stats-title">أسباب النزول في تفسير الجلالين (نزلت / نزل / أنزل)</div>
            <div class="stats-desc">
              പരീക്ഷകളിൽ നിരന്തരം ആവർത്തിക്കുന്ന 'فيمن نزلت؟' (ആരുടെ പശ്ചാത്തലത്തിലാണ് ഇറങ്ങിയത്?), 'ما سبب النزول؟' തുടങ്ങിയ ചോദ്യങ്ങൾക്കുള്ള ജലാലൈനി ശറഹിലെ മുഴുവൻ അറബിക് ഉദ്ധരണികളും മലയാള വിശദീകരണവും.
            </div>
          </div>
          <div class="stats-badge-pill">
            <span>✨ ${toArabicNumeral(totalEvents)} موضعاً معتمداً</span>
            <span>•</span>
            <span>${toArabicNumeral(surahsWithAsbab.length)} سورة</span>
          </div>
        </div>
      `;

      let matchCount = 0;

      surahsWithAsbab.forEach(surah => {
        const events = ASBAB[surah.surahNumber];
        
        // Filter events by query if present
        const filteredEvents = events.filter(e => {
          if (!query || !query.trim()) return true;
          const q = query.trim().toLowerCase();
          return (
            e.quranText.toLowerCase().includes(q) ||
            e.arabicSnippet.toLowerCase().includes(q) ||
            e.malayalamExplanation.toLowerCase().includes(q) ||
            surah.surahNameArabic.toLowerCase().includes(q) ||
            surah.surahNameMalayalam.toLowerCase().includes(q)
          );
        });

        if (filteredEvents.length === 0) return;
        matchCount += filteredEvents.length;

        html += `
          <div id="asbab-surah-${surah.surahNumber}" class="surah-asbab-header">
            <h2 class="surah-asbab-title">${surah.surahNameArabic} <span style="font-size:0.75em; font-family:var(--font-ml); opacity:0.85;">(${surah.surahNameMalayalam})</span></h2>
            <span class="surah-asbab-count">${toArabicNumeral(filteredEvents.length)} سبب نزول</span>
          </div>
        `;

        filteredEvents.forEach(e => {
          const quranHighlight = highlightSearch(e.quranText, query);
          const arHighlight = highlightSearch(formatMatnPhrases(e.arabicSnippet), query);
          const mlHighlight = highlightSearch(e.malayalamExplanation, query);
          const aNumAr = toArabicNumeral(e.ayahNumber);

          html += `
            <div class="asbab-card">
              <div class="asbab-card-top">
                <div class="ayah-num-badge">
                  <span class="ayah-circ">${aNumAr}</span>
                  <span>آية [${aNumAr}] من ${surah.surahNameArabic}</span>
                </div>
                <button class="btn" style="padding:0.2rem 0.6rem; font-size:0.75rem;" onclick="copyAsbabCard('${surah.surahNameArabic}', ${e.ayahNumber}, '${e.quranText.replace(/'/g, "\\'")}', '${e.arabicSnippet.replace(/'/g, "\\'")}', '${e.malayalamExplanation.replace(/'/g, "\\'")}')" title="نسخ السبب">
                  📋 نسخ
                </button>
              </div>

              <!-- Quran Box -->
              <div class="asbab-quran-box">
                ﴿ ${quranHighlight} ﴾
              </div>

              <!-- Arabic Jalalayn Snippet -->
              <div class="asbab-arabic-box">
                <span class="box-label-ar">📖 عبارة الشرح في تفسير الجلالين (نص سبب النزول):</span>
                ${arHighlight}
              </div>

              <!-- Malayalam Explanation -->
              <div class="asbab-ml-box">
                <div class="box-label-ml">
                  <span>💡 അവതരണ പശ്ചാത്തലവും വിശദീകരണവും (Malayalam Sharh Explanation):</span>
                </div>
                <div>${mlHighlight}</div>
              </div>
            </div>
          `;
        });
      });

      if (matchCount === 0) {
        html += `
          <div style="text-align:center; padding:3rem; color:var(--text-muted); font-size:1.1rem;">
            لم يتم العثور على أي نتيجة مطابقة للبحث "${query}".
          </div>
        `;
      }

      readingContainer.innerHTML = html;
    }

    // Font resizing
    document.getElementById("btnFontInc").addEventListener("click", () => {
      if (currentArabicFontSize < 2.5) {
        currentArabicFontSize += 0.12;
        document.documentElement.style.setProperty('--arabic-font-size', `${currentArabicFontSize}rem`);
      }
    });

    document.getElementById("btnFontDec").addEventListener("click", () => {
      if (currentArabicFontSize > 1.2) {
        currentArabicFontSize -= 0.12;
        document.documentElement.style.setProperty('--arabic-font-size', `${currentArabicFontSize}rem`);
      }
    });

    // Theme toggling
    document.getElementById("btnThemeToggle").addEventListener("click", () => {
      themeIndex = (themeIndex + 1) % themes.length;
      document.documentElement.setAttribute('data-theme', themes[themeIndex]);
    });

    // Search input
    let searchTimer = null;
    searchInput.addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        renderAsbabPage(e.target.value);
      }, 300);
    });

    // Initial render
    renderAsbabPage();
  </script>
</body>
</html>
